<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Continental">

<title>Continental · Happy Family</title>

<style>
:root{
  --felt:#0b2350; --felt-2:#1d4e96; --felt-3:#3a7bd5;
  --paper:#fbf7ee; --paper-2:#f1ead9; --ink:#1d1b16; --muted:#6f6857;
  --red:#b3261e; --gold:#c9a227; --line:#ddd3bd;
  --ok:#1f7a4d; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:linear-gradient(170deg,#4a8de0 0%,#1d4e96 45%,#0b2350 100%) fixed;
  color:var(--ink); min-height:100vh; padding-bottom:84px;
}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;margin:0}
button,input,select{font:inherit}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

/* Header */
header{color:var(--paper);padding:calc(18px + env(safe-area-inset-top)) 0 10px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .suits{font-size:22px;letter-spacing:2px}
.brand .suits .r{color:#ff8a80}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden;margin-right:6px}
.lang button{background:transparent;border:0;color:var(--paper);opacity:.6;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer}
.lang button.on{background:rgba(255,255,255,.2);opacity:1}
.brand h1{font-size:22px;line-height:1.05}
.brand small{display:block;font-family:system-ui,sans-serif;font-size:12px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
.me{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--paper);
  border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.sync{font-size:12px;color:var(--paper);opacity:.7;text-align:right;padding:0 14px;max-width:760px;margin:0 auto}
.sync.err{color:#ffb4a9;opacity:1}

/* Cards */
.card{background:var(--paper);border-radius:var(--radius);padding:16px;margin:12px 0;
  box-shadow:0 6px 18px rgba(0,0,0,.25)}
.card h2{font-size:20px;margin-bottom:10px}
.card h3{font-size:16px;margin:4px 0 8px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

/* Buttons */
.btn{border:0;border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:600;
  background:var(--felt-2);color:var(--paper)}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.red{background:var(--red)}
.btn.ghost{background:transparent;color:var(--felt-2);border:1.5px solid var(--felt-2)}
.btn.block{width:100%}
.btn.small{padding:7px 11px;font-size:14px}

/* Tables */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
.rank th,.rank td{padding:8px 2px}
.rank{font-size:14px}
.rank th{font-size:10px;letter-spacing:0}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.l,th.l{text-align:left}
tr.lead td{background:#fff6d6}
.medal{font-size:18px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.score-table{table-layout:fixed}
.score-table th,.score-table td{padding:7px 2px}
.score-table th.l{width:54px}
.score-table th.pl{color:var(--ink);font-size:12px;text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score-table td.rd{text-align:left;font-size:11px;color:var(--muted);white-space:nowrap}
.score-table td.rd b{color:var(--ink);font-size:14px;margin-right:2px}
.score-table td .pts{font-size:15px;font-weight:600}
.score-table td .acc{display:block;font-size:12px;color:var(--muted)}
.score-table tr.total td{font-weight:700;font-size:17px;border-top:2px solid var(--ink);border-bottom:0}
.zero{color:var(--ok)}
.win{color:var(--ok);font-weight:700}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 2px;text-decoration:none}
.chip{display:inline-block;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--paper-2);color:var(--muted);margin:2px 3px 2px 0}
.chip.on{background:#d9efe3;color:var(--ok)}
.chip.live{background:#ffe3df;color:var(--red)}

/* Forms */
label.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:#fff}
label.check input{width:20px;height:20px;accent-color:var(--felt-2)}
label.check:has(input:checked){border-color:var(--felt-2);background:#eaf2fd}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=date],input[type=text],input[type=number],select{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.field{margin:10px 0}
.field > span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}

.entry{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;margin:6px 0}
.entry input{font-size:20px;text-align:center;font-weight:600;padding:8px}
.entry .zbtn{font-size:12px;margin-left:6px}
.contract{background:var(--felt);color:var(--paper);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.contract small{opacity:.7;text-transform:uppercase;letter-spacing:.08em;font-size:11px}
.contract div{font-family:Georgia,serif;font-size:20px}

.seg{display:inline-flex;background:var(--paper-2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;padding:4px 1px;min-width:0}
nav.tabs a .i{display:block;font-size:22px;line-height:1.1}
nav.tabs a.on{color:var(--felt-2);font-weight:700}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:600px){.modal-bg{align-items:center}}
.modal{background:var(--paper);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:20px;max-height:90vh;overflow:auto}
@media(min-width:600px){.modal{border-radius:18px}}
.modal h2{font-size:21px;margin-bottom:6px}
.warn{background:#fff1ee;border-left:4px solid var(--red);padding:10px 12px;border-radius:6px;font-size:14px;margin:12px 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90vw}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .big{font-size:40px}
.back{color:var(--paper);text-decoration:none;font-size:14px;opacity:.85;display:inline-block;margin-top:6px}
code{background:var(--paper-2);padding:1px 5px;border-radius:4px;font-size:13px;word-break:break-all}
</style>
</head>

function detectRepo(){
  const h = location.hostname, parts = location.pathname.split('/').filter(Boolean);
  if (h.endsWith('.github.io')) return { owner: h.replace('.github.io',''), repo: parts[0] || h };
  return { owner:'', repo:'' };
}
function loadCfg(){
  let c = {};
  try { c = JSON.parse(localStorage.getItem(LS.cfg) || '{}'); } catch(e){}
  const d = detectRepo();
  return { owner: c.owner || d.owner, repo: c.repo || d.repo, branch: c.branch || 'main', token: c.token || '' };
}
function saveCfg(c){ try{ localStorage.setItem(LS.cfg, JSON.stringify(c)); }catch(e){} }
let cfg = loadCfg();

(function readTokenFromLink(){
  const m = location.hash.match(/token=([^&]+)/);
  if (m){
    cfg.token = decodeURIComponent(m[1]); saveCfg(cfg);
    history.replaceState(null,'',location.pathname + location.search + '#/');
    setTimeout(()=>toast(t('linked')), 400);
  }
})();
const isGitHub = () => !!(cfg.owner && cfg.repo);

/* ---------- Store ---------- */
let DB = null, SHA = null, lastSync = null;
function b64ToUtf8(b64){
  const bin = atob(b64.replace(/\n/g,''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function utf8ToB64(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function ghHeaders(){
  const h = { 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
  if (cfg.token) h['Authorization'] = 'Bearer ' + cfg.token;
  return h;
}
function apiUrl(){ return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${DATA_PATH}`; }
function defaultData(){
  return { version:1, players:[
    {id:'joan',name:'Joan'},{id:'merce',name:'Mercè'},{id:'albert',name:'Albert'},
    {id:'ricard',name:'Ricard'},{id:'cristina-l',name:'Cristina L.'},{id:'cristina-a',name:'Cristina A.'}
  ], sessions:[] };
}
async function load(){
  if (!isGitHub()){
    try { DB = JSON.parse(localStorage.getItem(LS.local) || 'null'); } catch(e){ DB = null; }
    if (!DB) DB = defaultData();
    SHA = null; lastSync = new Date(); setSync(); return;
  }
  const r = await fetch(apiUrl() + '?ref=' + encodeURIComponent(cfg.branch) + '&_=' + Date.now(), { headers: ghHeaders(), cache:'no-store' });
  if (r.status === 404 && cfg.token){ DB = defaultData(); SHA = null; lastSync = new Date(); setSync(); return; }
  if (!r.ok) throw new Error(await ghError(r));
  const j = await r.json();
  DB = JSON.parse(b64ToUtf8(j.content)); SHA = j.sha; lastSync = new Date(); setSync();
}
async function ghError(r){
  let msg = 'Error ' + r.status;
  try { const j = await r.json(); if (j.message) msg += ': ' + j.message; } catch(e){}
  if (r.status === 401) msg = t('errToken');
  if (r.status === 403 && !cfg.token) msg = t('errRate');
  if (r.status === 404 && !cfg.token) msg = t('errNoRepo');
  return msg;
}
let busy = false;
async function mutate(fn, message){
  if (busy) throw new Error(t('errBusy'));
  busy = true; setSync(t('saving'));
  try{
    for (let attempt = 0; attempt < 4; attempt++){
      if (attempt > 0 || isGitHub()) await load();
      const copy = JSON.parse(JSON.stringify(DB));
      const result = fn(copy);
      if (!isGitHub()){
        localStorage.setItem(LS.local, JSON.stringify(copy)); DB = copy; lastSync = new Date(); setSync(); return result;
      }
      if (!cfg.token) throw new Error(t('errNotLinked'));
      const body = { message: message + (ME() ? ` (${playerName(ME())})` : ''),
                     content: utf8ToB64(JSON.stringify(copy, null, 2) + '\n'), branch: cfg.branch };
      if (SHA) body.sha = SHA;
      const r = await fetch(apiUrl(), { method:'PUT', headers:{...ghHeaders(),'Content-Type':'application/json'}, body: JSON.stringify(body) });
      if (r.ok){ const j = await r.json(); DB = copy; SHA = j.content.sha; lastSync = new Date(); setSync(); return result; }
      if (r.status === 409 || r.status === 422) continue;
      throw new Error(await ghError(r));
    }
    throw new Error(t('errRetry'));
  } finally { busy = false; setSync(); }
}
function setSync(text){
  const el = document.getElementById('sync');
  el.classList.remove('err');
  if (text){ el.textContent = text; return; }
  if (!isGitHub()){ el.textContent = t('localMode'); return; }
  const tm = lastSync ? lastSync.toLocaleTimeString(t('locale'),{hour:'2-digit',minute:'2-digit'}) : '—';
  el.textContent = (cfg.token ? '🔗 ' : t('readOnly')) + `${cfg.owner}/${cfg.repo} · ${t('updated')} ${tm}`;
}
function syncError(msg){ const el = document.getElementById('sync'); el.textContent = '⚠︎ ' + msg; el.classList.add('err'); }

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const ME = () => localStorage.getItem(LS.me) || '';
const player = id => DB.players.find(p => p.id === id);
const playerName = id => (player(id) || {name:'?'}).name;
function shortName(id){ const n = playerName(id), w = n.split(/\s+/);
  return n.length <= 7 ? n : (w.length > 1 ? w[0].slice(0,4) + ' ' + w.slice(1).join(' ') : n.slice(0,7)); }
function fmtDate(iso, long){
  const d = new Date(iso + 'T12:00:00');
  return d.toLocaleDateString(t('locale'), long ? {weekday:'long', day:'numeric', month:'long', year:'numeric'} : {day:'numeric', month:'short', year:'numeric'});
}
function todayISO(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function toast(msg, ms=2600){ const el = document.createElement('div'); el.className='toast'; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(), ms); }
function slug(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || uid(); }
const joinNames = ids => ids.map(p => esc(playerName(p))).join(' ' + t('and') + ' ');

function gameTotals(g){
  const tt = {}; g.players.forEach(p => tt[p] = 0);
  g.rounds.forEach(r => g.players.forEach(p => tt[p] += (r.scores[p] || 0)));
  return tt;
}
const DELETE_AFTER_MS = 60 * 60 * 1000;   // 1 hora sense puntuació -> es pot esborrar
const fmtTime = iso => new Date(iso).toLocaleTimeString(t('locale'), {hour:'2-digit', minute:'2-digit'});
const fmtDay = iso => new Date(iso).toLocaleDateString(t('locale'), {day:'numeric', month:'short'});
const canDelete = g => !g.rounds.length && !g.ended && !!g.created && !isNaN(Date.parse(g.created)) && Date.now() - Date.parse(g.created) >= DELETE_AFTER_MS;
const MIN_END_ROUND = 6;   // a partir de la ronda 6 es pot acabar la partida
const isFinished = g => !!g.ended || g.rounds.length >= NROUNDS;
// Jugadors que no juguen la partida: es guarda a la partida; si és antiga, tots els altres
function gameAbsent(g){
  const list = g.absent || DB.players.map(p => p.id).filter(id => !g.players.includes(id));
  return list.filter(id => !g.players.includes(id));
}
// Mitjana dels totals dels qui han jugat (arrodonida). Només per a partides acabades.
function absentAvg(g){
  if (!isFinished(g) || !g.rounds.length) return null;
  const tt = gameTotals(g), v = g.players.map(p => tt[p]);
  return Math.round(v.reduce((a,b) => a + b, 0) / v.length);
}
function gameWinners(g){
  if (!isFinished(g)) return [];
  const tt = gameTotals(g); const min = Math.min(...Object.values(tt));
  return g.players.filter(p => tt[p] === min);
}
const findSession = id => DB.sessions.find(s => s.id === id);
const findGame = (s, gid) => s && s.games.find(g => g.id === gid);

function viewRanking(){
  const years = [...new Set(DB.sessions.map(s => s.date.slice(0,4)))].sort().reverse();
  const stats = {};
  DB.players.forEach(p => stats[p.id] = { id:p.id, pts:0, games:0, abs:0, wins:0 });
  DB.sessions.filter(s => rankYear === 'all' || s.date.startsWith(rankYear)).forEach(s => s.games.forEach(g => {
    if (!g.rounds.length) return;
    const tt = gameTotals(g);
    g.players.forEach(p => { if (stats[p]) stats[p].pts += tt[p]; });
    if (isFinished(g)){
      g.players.forEach(p => stats[p] && stats[p].games++);
      gameWinners(g).forEach(p => stats[p] && stats[p].wins++);
      const av = absentAvg(g);
      gameAbsent(g).forEach(p => { if (stats[p]) { stats[p].pts += av; stats[p].abs++; } });
    }
  }));
  const rows = Object.values(stats).filter(s => s.pts > 0 || s.games > 0);
  rows.forEach(s => s.avg = (s.games + s.abs) ? s.pts / (s.games + s.abs) : null);
  const key = { total: (a,b) => a.pts - b.pts,
                avg: (a,b) => (a.avg ?? 1e9) - (b.avg ?? 1e9),

  const medals = ['🥇','🥈','🥉'];

      ${years.length ? `<select style="width:auto" onchange="rankYear=this.value;render()">

    </div>
    <p class="muted" style="margin:0 0 10px">${t('lowWins')}</p>
    <div class="seg" style="margin-bottom:10px">
      ${[['total',t('mTotal')],['avg',t('mAvg')],['wins',t('mWins')]].map(([k,l]) =>
        `<button class="${rankMode===k?'on':''}" onclick="rankMode='${k}';localStorage.setItem('ch.rankMode',rankMode);render()">${l}</button>`).join('')}
    </div>
    ${rows.length ? `<div class="scroll"><table class="rank">
      <thead><tr><th></th><th class="l">${t('player')}</th><th>${t('points')}</th><th>${t('gamesShort')}</th><th>${t('absGames')}</th><th>${t('avg')}</th><th>${t('winsShort')}</th></tr></thead>
      <tbody>${rows.map((s,i) => `<tr class="${i===0?'lead':''}">

  let entry = '';
  if (!done){
    entry = `<div class="card">
      <div class="contract"><small>${t('round')} ${next+1} ${t('of')} ${NROUNDS} · ${t('contract')}</small><div>${R(next)} <span style="font-size:14px;opacity:.75">· ${CARDS[next]} ${t('cards')}</span></div></div>
      <p class="muted" style="margin-top:0">${t('handHelp')}<br><span style="font-size:12px">${t('closeHelp')}</span></p>
      ${g.players.map(p => `<div class="entry"><label for="sc_${p}"><b>${esc(playerName(p))}</b>
          <span style="white-space:nowrap"><button class="btn ghost small zbtn" type="button" onclick="setZero('${p}')">${t('closes')}</button><button class="btn ghost small zbtn" type="button" onclick="setZero('${p}',-10)">${t('closesTable')}</button></span></label>
        <input id="sc_${p}" type="number" inputmode="numeric" step="1" placeholder="—"></div>`).join('')}
      <button class="btn block red" style="margin-top:10px" onclick="confirmRound('${sid}','${gid}')">${t('writeRound')} ${next+1}</button>
      ${next >= MIN_END_ROUND ? `<button class="btn block ghost" style="margin-top:8px" onclick="askEnd('${sid}','${gid}')">${t('endGame')}</button>` : ''}
    </div>`;
  }
  const absent = gameAbsent(g), av = absentAvg(g);
  const absentCard = absent.length ? `<div class="card"><h3>${t('absentTitle')}</h3>
    ${absent.map(p => `<div class="spread" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(playerName(p))}</span>
      <b>${av === null ? '—' : av + ' ' + t('pts')}</b></div>`).join('')}
    ${av === null ? '' : `<p class="muted" style="font-size:12px;margin:8px 0 0">${t('absentShort')}: ${g.players.map(p => totals[p]).join(' + ')} = ${g.players.reduce((a,p) => a + totals[p], 0)} ÷ ${g.players.length} ≈ ${av}</p>`}
  </div>` : '';
  return `<a class="back" href="#/jornada/${s.id}">‹ ${fmtDate(s.date)}</a>
  <div class="card">
    <div class="spread"><h2>${t('game')} ${g.number}</h2>${done?`<span class="chip on">${t('finished')}</span>`:`<span class="chip live">${t('live')}</span>`}</div>
    ${done ? `<p style="margin:4px 0 10px;font-size:17px">${t('wins')} <b>${joinNames(winners)}</b> ${t('with')} ${totals[winners[0]]} ${t('pts')}</p>` : ''}
    ${g.ended ? `<p class="muted" style="margin:0 0 8px">${t('endedAt', {n: g.rounds.length})}</p>` : ''}
    ${g.created && !isNaN(Date.parse(g.created)) ? `<p class="muted" style="margin:0 0 8px;font-size:13px">🕒 ${t('createdAt', {d: fmtDay(g.created), h: fmtTime(g.created)})}</p>` : ''}
    ${table}
    <p class="muted" style="font-size:11px;margin:8px 0 0">${t('legend')}</p>
  </div>
  ${entry}
  ${!g.rounds.length && !g.ended ? (canDelete(g)
      ? `<button class="btn block red" style="margin-bottom:12px" onclick="askDelete('${sid}','${gid}')">${t('delGame')}</button>`
      : (g.created ? `<p class="muted" style="text-align:center;color:var(--paper);opacity:.8;font-size:13px;margin:0 0 12px">${t('delWhen', {h: fmtTime(new Date(Date.parse(g.created) + DELETE_AFTER_MS).toISOString())})}</p>` : '')) : ''}
  ${absentCard}
  ${done ? `<button class="btn block" style="margin-bottom:12px" onclick="newGame('${sid}')">${t('otherGame')}</button>` : ''}`;
}
function askDelete(sid, gid){
  const g = findGame(findSession(sid), gid); if (!g) return;
  if (!canDelete(g)) return toast(t('delNo'), 4000);
  modal(`<h2>${t('delQ', {n: g.number})}</h2>
    <p class="muted">${t('delHelp')}<br>🕒 ${t('createdAt', {d: fmtDay(g.created), h: fmtTime(g.created)})}</p>
    <div class="warn">${t('delIrrev')}</div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn ghost" style="flex:1" onclick="closeModal()">${t('cancel')}</button>
      <button class="btn red" style="flex:1" id="delBtn" onclick="deleteGame('${sid}','${gid}')">${t('delYes')}</button></div>`);
}
async function deleteGame(sid, gid){
  $('#delBtn').disabled = true; $('#delBtn').textContent = t('saving');
  try{
    const sessionGone = await mutate(db => {
      const s = db.sessions.find(x => x.id === sid), g = s && s.games.find(x => x.id === gid);
      if (!g) throw new Error(t('gameGone'));
      if (!canDelete(g)) throw new Error(t('delNo'));      // es torna a comprovar amb les dades fresques
      s.games = s.games.filter(x => x.id !== gid);
      s.games.forEach((x, i) => x.number = i + 1);
      if (!s.games.length) { db.sessions = db.sessions.filter(x => x.id !== sid); return true; }
      return false;
    }, `Esborrar partida sense puntuació · ${sid}`);
    closeModal(); toast(t('deleted'));
    location.hash = sessionGone ? '#/jornadas' : `#/jornada/${sid}`;
  }catch(e){ closeModal(); toast(e.message, 4500); render(); }
}
function askEnd(sid, gid){
  const g = findGame(findSession(sid), gid); if (!g || isFinished(g)) return;
  const n = g.rounds.length;
  modal(`<h2>${t('endQ')}</h2>
    <p class="muted">${t('endHelp', {n})}</p>
    <div class="warn">${t('endIrrev')}</div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn ghost" style="flex:1" onclick="closeModal()">${t('keepPlaying', {n: n + 1})}</button>
      <button class="btn red" style="flex:1" id="endBtn" onclick="endGame('${sid}','${gid}',${n})">${t('endGame')}</button></div>`);
}
async function endGame(sid, gid, n){
  $('#endBtn').disabled = true; $('#endBtn').textContent = t('saving');
  try{
    await mutate(db => {
      const s = db.sessions.find(x => x.id === sid), g = s && s.games.find(x => x.id === gid);
      if (!g) throw new Error(t('gameGone'));
      if (g.rounds.length !== n || g.ended) throw new Error(t('alreadyRound'));
      if (n < MIN_END_ROUND) throw new Error('Min ' + MIN_END_ROUND);
      g.ended = { at: new Date().toISOString(), by: ME() || null, round: n };
    }, `Partida acabada a la ronda ${n} · ${sid}`);
    closeModal(); toast(t('endedToast', {n})); render();
  }catch(e){ closeModal(); toast(e.message, 4500); render(); }
}
function setZero(p, v = 0){ const i = $('#sc_' + p); i.value = v; i.focus(); }

function confirmRound(sid, gid){
  if (!ME()) { toast(t('whoAreYou')); return pickMe(); }
  const s = findSession(sid), g = findGame(s, gid);
  const scores = {};
  for (const p of g.players){
    const v = $('#sc_' + p).value.trim();
    if (v === '') { toast(`${t('missing')} ${playerName(p)}`); $('#sc_' + p).focus(); return; }
    if (!/^\d+$/.test(v) && v !== '-10') { toast(`${t('badScore')} ${playerName(p)} (≥ 0 o −10)`, 3500); $('#sc_' + p).focus(); return; }
    scores[p] = parseInt(v, 10);
  }
  if (Object.values(scores).filter(v => v === -10).length > 1) { toast(t('minus10Only'), 3500); return; }
  const zeros = Object.values(scores).filter(v => v <= 0).length;
  const n = g.rounds.length;
  modal(`<h2>${t('confirmQ')} ${n+1}${LANG==='es'?'?':'?'}</h2>
    <p class="muted" style="margin:0">${R(n)}</p>
    <table style="margin:12px 0"><tbody>${g.players.map(p => `<tr><td class="l">${esc(playerName(p))}</td>
      <td style="font-size:20px;font-weight:700" class="${scores[p]<=0?'zero':''}">${scores[p] < 0 ? '−' + Math.abs(scores[p]) : scores[p]}</td></tr>`).join('')}</tbody></table>
    ${zeros === 0 ? `<div class="warn" style="border-color:var(--gold);background:#fff9e6">${t('nobodyZero')}</div>` : ''}
    <div class="warn">${t('noEdit')}</div>
    <div class="row"><button class="btn ghost" onclick="closeModal()">${t('review')}</button>
      <button class="btn red" style="flex:1" id="okBtn" onclick="saveRound('${sid}','${gid}',${n},${JSON.stringify(scores).replace(/"/g,'&quot;')})">${t('yesConfirm')}</button></div>`);
}
async function saveRound(sid, gid, n, scores){
  $('#okBtn').disabled = true; $('#okBtn').textContent = t('saving');
  try{
    await mutate(db => {
      const s = db.sessions.find(x => x.id === sid), g = s && s.games.find(x => x.id === gid);
      if (!g) throw new Error(t('gameGone'));
      if (g.rounds.length !== n) throw new Error(t('alreadyRound'));
      g.rounds.push({ n: n + 1, scores, by: ME(), at: new Date().toISOString() });
    }, `Ronda ${n+1} · ${sid}`);
    closeModal(); toast(n + 1 === NROUNDS ? t('gameOver') : `✅ ${t('round')} ${n+1} ${t('roundSaved')}`);
    render();
    if (n + 1 >= MIN_END_ROUND && n + 1 < NROUNDS) askEnd(sid, gid);
  }catch(e){ closeModal(); toast(e.message, 4500); render(); }
}

async function saveSettings(){

  try { await load(); toast(t('connected')); } catch(e){ syncError(e.message); toast(e.message, 4500); }

}
function copyLink(){ const i = $('#shareLink'); i.select(); navigator.clipboard?.writeText(i.value); toast(t('copied')); }
async function addPlayer(){
  const name = $('#newName').value.trim(); if (!name) return;
  try{ await mutate(db => {
      if (db.players.some(p => p.name.toLowerCase() === name.toLowerCase())) throw new Error(t('exists'));
      let id = slug(name); while (db.players.some(p => p.id === id)) id += '-2';
      db.players.push({ id, name });
    }, `Nou jugador ${name}`); render(); toast(t('added'));
  }catch(e){ toast(e.message, 4000); }
}

  modal(`<h2>${t('rename')}</h2><input type="text" id="rnName" value="${esc(playerName(id))}">

    <button class="btn" style="flex:1" onclick="doRename('${id}')">${t('save')}</button></div>`);

async function doRename(id){
  const name = $('#rnName').value.trim(); if (!name) return; closeModal();
  try{ await mutate(db => { db.players.find(p => p.id === id).name = name; }, `Canvi de nom ${id}`); render(); updateMe(); }
  catch(e){ toast(e.message, 4000); }
}

/* ---------- Router ---------- */
function render(){
  if (!DB) return;
  const h = location.hash.replace(/^#/, '') || '/';
  const parts = h.split('/').filter(Boolean);
  let html, tab = 'rank';
  if (!parts.length)                { html = viewRanking(); }
  else if (parts[0] === 'jornadas') { html = viewSessions(); tab='days'; }
  else if (parts[0] === 'nueva')    { html = viewNewSession(); tab='new'; }
  else if (parts[0] === 'jornada')  { html = viewSession(parts[1]); tab='days'; }
  else if (parts[0] === 'partida')  { html = viewGame(parts[1], parts[2]); tab='days'; }
  else if (parts[0] === 'ajustes')  { html = viewSettings(); tab='cfg'; }
  else if (parts[0] === 'normes')   { html = viewRules(); tab='rules'; }
  else html = notFound();
  const typed = {}; document.querySelectorAll('[id^=sc_]').forEach(i => typed[i.id] = i.value);
  $('#app').innerHTML = html;
  Object.entries(typed).forEach(([k,v]) => { const i = document.getElementById(k); if (i) i.value = v; });
  document.querySelectorAll('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  updateMe();
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0,0); });

async function refresh(){
  if (busy || $('#modal') || location.hash.startsWith('#/ajustes') || location.hash.startsWith('#/nueva')) return;
  try { await load(); render(); } catch(e){ syncError(e.message); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
setInterval(() => { if (!document.hidden && isGitHub()) refresh(); }, 30000);

(async function init(){
  document.documentElement.lang = LANG;
  applyStatic();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  try { await load(); }
  catch(e){ syncError(e.message); DB = defaultData(); }
  render();
  if (!ME()) pickMe();
})();
</script>
